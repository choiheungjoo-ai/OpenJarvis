# Newton v4 — voice layer configuration.
#
# Optional. Defaults apply when absent. Create voice.local.yaml for
# sir-only overrides (gitignored).

audio:
  # Silero VAD + Whisper both want 16 kHz mono.
  sample_rate: 16000
  # 512 samples ≈ 32 ms at 16 kHz — matches Silero's expected chunk.
  chunk_samples: 512
  # null = sounddevice default input. Override with device name or index.
  mic_device: null

vad:
  # Probability above which a chunk counts as speech.
  threshold: 0.5
  # Minimum consecutive speech chunks before "speech started" fires
  # downstream — filters single-chunk noise (keyboard, mouse clicks).
  min_speech_chunks: 3
  # Consecutive silence chunks before "speech ended" — wider = less
  # choppy turn-taking, narrower = lower latency.
  min_silence_chunks: 15

# Stage 1 — what wakes Newton up. Either a wake word or a 2-clap pattern.
stage1:
  wake:
    enabled: true
    # Wake words sir / gf will say. "newton" is the generic system wake;
    # the persona names also count as wake words and route via the
    # persona engine (block 3).
    wake_words: ["newton", "jarvis", "friday", "butler"]
    score_threshold: 0.5
  clap:
    enabled: true
    # Per-chunk RMS above which a chunk is a peak candidate.
    peak_threshold: 0.15
    # Min/max gap between the two peaks. The pair-in-window rule
    # filters door slams and single hand claps.
    min_gap_ms: 90
    max_gap_ms: 500

# ── TTS routing (block 5 step 5.5) ─────────────────────────────────────
#
# Persona + language → engine + voice sample. The router caches
# engine instances; the engine itself stays lazy until its first
# synthesize. Voice references are relative to ``voice_root`` and
# may not exist yet (samples come from step 5.4).
tts:
  voice_root: data/voices
  routes:
    - persona: butler
      language: any
      engine: qwen3_tts_0.6b
      voice_reference: butler/ko-001.wav
    - persona: jarvis
      language: ko
      engine: qwen3_tts_1.7b
      voice_reference: jarvis/samples/ko/ko-001.wav
    - persona: jarvis
      language: en
      engine: chatterbox
      voice_reference: jarvis/samples/en/en-001.wav
    - persona: friday
      language: ko
      engine: qwen3_tts_1.7b
      voice_reference: friday/ko-001.wav
    - persona: friday
      language: en
      engine: qwen3_tts_1.7b
      voice_reference: friday/en-001.wav

# ── Multi-speaker session lock (block 5 step 5.10) ─────────────────────
session_lock:
  # Seconds of silence from the locked user before the session unlocks
  # and the next Stage-1 wake-word / clap starts fresh.
  timeout_seconds: 30

# ── Voice ID enrollment + recognition (block 5 step 5.9) ───────────────
#
# Resemblyzer-backed speaker embeddings. The backend stays out of
# default install (Strategy D: no torch in core); install the
# ``voice-id`` extra to switch ``backend`` to ``resemblyzer``.
voice_id:
  # ``resemblyzer`` → torch-backed encoder (needs the voice-id extra).
  # ``fake`` → deterministic hash-based encoder for tests / dev.
  backend: resemblyzer
  # Resemblyzer ships a CPU-light encoder; CPU keeps us off the
  # RTX 5090 / sm_120 CUDA toolchain and matches the design.
  device: cpu
  # Cosine similarity above which ``identify`` returns a match.
  # 0.75 is a first-pass guess; tune on real recordings.
  threshold: 0.75
  # Resemblyzer's expected sample rate (preprocess_wav resamples
  # internally, but the value lives in config so callers can pass it
  # through without hardcoding).
  sample_rate: 16000

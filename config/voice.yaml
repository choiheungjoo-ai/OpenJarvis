# Newton v4 — voice layer configuration.
#
# Optional. Defaults apply when absent. Create voice.local.yaml for
# sir-only overrides (gitignored).

audio:
  # Silero VAD + Whisper both want 16 kHz mono.
  sample_rate: 16000
  # 512 samples ≈ 32 ms at 16 kHz — matches Silero's expected chunk.
  chunk_samples: 512
  # null = sounddevice default input. Override with device name or index.
  mic_device: null

vad:
  # Probability above which a chunk counts as speech.
  threshold: 0.5
  # Minimum consecutive speech chunks before "speech started" fires
  # downstream — filters single-chunk noise (keyboard, mouse clicks).
  min_speech_chunks: 3
  # Consecutive silence chunks before "speech ended" — wider = less
  # choppy turn-taking, narrower = lower latency.
  min_silence_chunks: 15

# Stage 1 — what wakes Newton up. Either a wake word or a 2-clap pattern.
stage1:
  wake:
    enabled: true
    # Wake words sir / gf will say. "newton" is the generic system wake;
    # the persona names also count as wake words and route via the
    # persona engine (block 3).
    wake_words: ["newton", "jarvis", "friday", "butler"]
    score_threshold: 0.5
  clap:
    enabled: true
    # Per-chunk RMS above which a chunk is a peak candidate.
    peak_threshold: 0.15
    # Min/max gap between the two peaks. The pair-in-window rule
    # filters door slams and single hand claps.
    min_gap_ms: 90
    max_gap_ms: 500
    # Permission mode (block-5 §5.12):
    #   clap_shared    — any registered user may wake via clap (default)
    #   clap_sir_only  — clap is provisional; confirmed only when the
    #                    first utterance Voice-IDs as ``privileged_user_id``
    #   clap_off       — clap trigger disabled; wake word only
    mode: clap_shared
    # User_id checked by ``clap_sir_only``. ``sir`` mirrors the seeded owner.
    privileged_user_id: sir

# ── TTS routing (block 5 step 5.5) ─────────────────────────────────────
#
# Persona + language → engine + voice sample. The router caches
# engine instances; the engine itself stays lazy until its first
# synthesize. Two synthesis modes:
#
#   * qwen3_tts_jarvis (custom voice) — fine-tuned model, no reference
#     clip needed; ``speaker: jarvis`` baked in.
#   * qwen3_tts_base   (clone)        — Base Qwen3-TTS model; needs a
#     ``voice_reference`` clip AND its exact ``ref_text`` transcript.
#
# ``backend`` controls how the ``qwen3_tts_*`` engines run:
#   * remote (default) — talk to the newton-tts Docker service over HTTP.
#                        Strategy D: the Newton core stays torch-free.
#   * local            — construct the in-process Qwen3TTS adapter (needs
#                        qwen-tts + GPU). Used by offline dev / unit tests.
# ``url`` / ``timeout_s`` apply only to ``remote`` and match the
# service deployed by deploy/docker/tts/compose.yaml.
#
# Voice references are relative to ``voice_root`` and may not exist
# yet (samples come from step 5.4 / voice.local.yaml).
tts:
  voice_root: data/voices
  backend: remote
  url: http://localhost:8081
  timeout_s: 60.0
  routes:
    - persona: butler
      language: any
      engine: qwen3_tts_base
      voice_reference: butler/ko-001.wav
      # ref_text: "…the exact transcript of butler/ko-001.wav…"
    - persona: jarvis
      language: ko
      engine: qwen3_tts_jarvis
      speaker: jarvis
    - persona: jarvis
      language: en
      engine: qwen3_tts_jarvis
      speaker: jarvis
    - persona: friday
      language: ko
      engine: qwen3_tts_base
      voice_reference: friday/ko-001.wav
      # ref_text: "…the exact transcript of friday/ko-001.wav…"
    - persona: friday
      language: en
      engine: qwen3_tts_base
      voice_reference: friday/en-001.wav
      # ref_text: "…the exact transcript of friday/en-001.wav…"

# ── Multi-speaker session lock (block 5 step 5.10) ─────────────────────
session_lock:
  # Seconds of silence from the locked user before the session unlocks
  # and the next Stage-1 wake-word / clap starts fresh.
  timeout_seconds: 30

# ── Filler phrases — instant-reply clips ───────────────────────────────
#
# Pre-synthesized clips that play instantly while the main answer is
# still synthesizing → ~zero perceived latency.
#
# Sensible JARVIS defaults (EN + KO) ship in code
# (newton.voice.fillers.DEFAULT_FILLERS). This block OVERRIDES them
# per-category: writing a category here replaces the default list for
# that (persona, language). Setting a list to ``[]`` disables the
# category. Untouched categories keep their defaults.
#
# Build the on-disk cache after editing:
#     newton voice fillers build --persona jarvis
#
# Cache layout: data/voices/<persona>/fillers/<lang>/<category>/<sha1>.wav
#
# fillers:
#   phrases:
#     jarvis:
#       en:
#         acknowledge:
#           - "Of course, sir. Allow me a moment to gather precisely what you need."
#           - "Right away, sir. I'm pulling the relevant pieces together as we speak."

# ── Voice ID enrollment + recognition (block 5 step 5.9) ───────────────
#
# Resemblyzer-backed speaker embeddings. The backend stays out of
# default install (Strategy D: no torch in core); install the
# ``voice-id`` extra to switch ``backend`` to ``resemblyzer``.
voice_id:
  # ``resemblyzer`` → torch-backed encoder (needs the voice-id extra).
  # ``fake`` → deterministic hash-based encoder for tests / dev.
  backend: resemblyzer
  # Resemblyzer ships a CPU-light encoder; CPU keeps us off the
  # RTX 5090 / sm_120 CUDA toolchain and matches the design.
  device: cpu
  # Cosine similarity above which ``identify`` returns a match.
  # 0.75 is a first-pass guess; tune on real recordings.
  threshold: 0.75
  # Resemblyzer's expected sample rate (preprocess_wav resamples
  # internally, but the value lives in config so callers can pass it
  # through without hardcoding).
  sample_rate: 16000

# Newton v4 — proactive engine configuration.
#
# Edit this file to tune Newton's threshold alerts and (in later steps)
# its mode behaviour. Optional: defaults apply if absent. For sir-only
# overrides, create config/proactive.local.yaml (gitignored).
#
# Defaults from docs/newton/design/newton-v4-jarvis-gap.md §3.1.

thresholds:
  # Each rule is matched against the most recent system_metrics row of
  # the named metric_type. `op` is one of '>' or '<'. When the
  # comparison holds and the rule is not in cooldown, a row is inserted
  # into proactive_notifications.
  #
  # The `kind` identifier is the storage-only prefix used for cooldown
  # bookkeeping; it is stripped before any notification is shown or
  # spoken (see newton.proactive.alerts.display_text).

  - kind: cpu_high
    metric_type: cpu
    op: ">"
    value: 90.0
    text: "Sir, CPU at {value:.0f}%."

  - kind: gpu_high
    metric_type: gpu
    op: ">"
    value: 85.0
    text: "Sir, GPU utilisation at {value:.0f}%."

  - kind: memory_high
    metric_type: memory
    op: ">"
    value: 90.0
    text: "Sir, memory at {value:.0f}%."

  - kind: gpu_temp_hot
    metric_type: temperature
    op: ">"
    value: 83.0
    text: "Sir, GPU temperature at {value:.0f}°C."

  - kind: battery_low
    metric_type: battery
    op: "<"
    value: 20.0
    text: "Sir, battery at {value:.0f}%."

  - kind: battery_critical
    metric_type: battery
    op: "<"
    value: 10.0
    text: "Sir, battery critically low — {value:.0f}%."

  # ── Dormant rules ──────────────────────────────────────────────────
  # The metric_types below are not produced by any monitor yet (step 4.1
  # ships cpu / gpu / memory / battery / temperature). These rules sit
  # in the config so the schema is complete from the start; they will
  # begin firing the moment a matching monitor lands in a later step,
  # with no code or config change here.

  - kind: vram_high
    metric_type: gpu       # gpu_util uses 'gpu'; a future vram monitor needs its own metric_type
    op: ">"
    value: 95.0
    text: "Sir, VRAM at {value:.0f}%."
    dormant: true          # never matches until a dedicated vram monitor exists

  - kind: disk_high
    metric_type: cpu       # placeholder — system_metrics has no 'disk' metric_type yet
    op: ">"
    value: 90.0
    text: "Sir, disk at {value:.0f}%."
    dormant: true

  - kind: cpu_temp_hot
    metric_type: temperature
    op: ">"
    value: 80.0
    text: "Sir, CPU temperature at {value:.0f}°C."
    # No CPU temp monitor yet — only GPU temp uses 'temperature'.
    # The checker disambiguates by source once a CpuTempMonitor lands.
    dormant: true

  - kind: network_slow
    metric_type: network
    op: "<"
    value: 50.0
    text: "Sir, network speed dropped to {value:.0f}% of baseline."
    dormant: true

# Cooldown — once a rule fires, the same kind is suppressed for this
# many minutes. Prevents a sustained high-CPU stretch from flooding
# proactive_notifications with one row per sampling tick.
cooldown_minutes: 15

# ── Pattern recognition (block 4 step 4.3) ────────────────────────────
#
# The learner detects time / sequence patterns (context patterns are
# deferred — see newton/proactive/patterns/context.py for the gap) and
# scores them with a three-factor model:
#
#     confidence = consistency × volume × recency × (1 - penalty)
#
# Every knob below is observable, not magical. Tune freely.
patterns:
  # How far back the learner looks. Observations older than this drop
  # out of both the numerator and the denominator naturally.
  observation_window_days: 28

  # Pre-filter floors. Below either of these, confidence is 0.0 —
  # too few observations to mean anything.
  min_occurrences_floor: 3       # numerator floor (doc's >=3 gate)
  min_opportunities: 4           # denominator floor

  # Volume factor saturates here: a 10-of-10 pattern at full
  # consistency is 1.0; a 3-of-3 isn't.
  min_confident_samples: 10

  # Recency decay e^(-days_since_last_seen / half_life_days).
  # 30 ⇒ a pattern not seen for ~30 days decays to ≈0.37.
  half_life_days: 30

  # Until users.timezone lands (likely block 4.5 quiet hours), all
  # weekday / hour bucketing goes through this single offset.
  pattern_timezone: Asia/Seoul

  sequence:
    # The default A→B window. "vault_search then vault_write within
    # 10 min" uses this if a more specific value isn't requested.
    default_window_seconds: 600

# ── Anticipation engine (block 4 step 4.4) ───────────────────────────
#
# Final score = stored confidence × relevance(now, pattern).
# A prediction fires if final >= thresholds[mode].
anticipation:
  # Fallback mode used until users.proactive_mode lands (step 4.8).
  default_mode: smart

  # Time-proximity relevance: Gaussian around the predicted eta.
  # σ = 30 minutes ⇒ relevance ≈0.61 at ±30 min, ≈0.13 at ±60 min.
  relevance_sigma_minutes: 30.0

  # A sequence pattern's A-event must have run within this many
  # seconds for the pattern to count as relevant *now*.
  sequence_relevance_seconds: 600

  # Top-N cap on returned predictions.
  max_results: 5

  thresholds:
    off: 1.01           # > 1.0 so no score ever crosses
    minimal: 0.9
    smart: 0.7
    aggressive: 0.5

# ── Notification scheduler (block 4 step 4.5) ────────────────────────
scheduler:
  # Belt-and-suspenders cap per tick (anticipation.max_results also caps).
  max_per_tick: 1

  # Per-pattern cooldown: don't schedule a second row for the same
  # pattern_id within this many minutes.
  pattern_cooldown_minutes: 30

  # Daily quiet window in patterns.pattern_timezone. Wraps midnight
  # when start > end (the typical 23:00–07:00 case). Zero-length
  # (start == end) means "never quiet".
  quiet_hours:
    start: "23:00"
    end: "07:00"

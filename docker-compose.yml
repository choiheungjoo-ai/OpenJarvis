# Newton v4 — local service stack.
#
# Newton is the only consumer of this compose file (OpenJarvis has its own
# under deploy/docker/ which we never touch).
#
# Services:
#   qdrant — vector store (block 3)
#   tei    — text embeddings inference, serving BGE-M3 (block 3.2)
#
# Everything Newton owns sits under data/ (gitignored), matching the
# convention from the SQLite DB. Override the data dirs via env if needed:
#
#     QDRANT_DATA_DIR=/elsewhere docker compose up -d qdrant
#     TEI_DATA_DIR=/elsewhere    docker compose up -d tei
#
# GPU note: this host exposes both an AMD iGPU and the NVIDIA RTX 5090, so
# the `--gpus all` shorthand fails (it tries to satisfy every vendor). We
# request the NVIDIA card explicitly through CDI (driver: cdi + the
# nvidia.com/gpu=all device). Requires nvidia-container-toolkit and a
# generated /etc/cdi/nvidia.yaml on the host.

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: newton-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_DATA_DIR:-./data/qdrant}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    container_name: newton-tei
    restart: unless-stopped
    # BGE-M3: multilingual (Korean-strong), 1024-dim dense, max seq 8192.
    command: ["--model-id", "${TEI_MODEL_ID:-BAAI/bge-m3}", "--port", "80"]
    ports:
      - "${TEI_PORT:-8080}:80"
    volumes:
      - ${TEI_DATA_DIR:-./data/tei}:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s  # first run downloads ~2GB model weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all
